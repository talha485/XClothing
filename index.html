<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>X Clothing</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div id="header"></div>
<div class="hero">
    <div class="slides">
        <div class="slide">
            <img src="images/Banner.png" alt="Banner">
            <h1>New Arrival</h1>
            <h2>Shop Now</h2>
        </div>
        <div class="slide">
            <img src="images/banner2.png" alt="Banner">
        </div>
        <div class="slide">
            <img src="images/banner3.png" alt="Banner">
        </div>
        <div class="slide">
            <img src="images/banner4.png" alt="Banner">
        </div>
    </div>
    <button class="prev-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
    <button class="next-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>

</div>
<div class="sale-new">
    <h1>Season Sale</h1>

</div>
<div id="season" class="container">

</div>
<div class="view-more">
    <a href="season-sale.html">
        <button>View More</button>
    </a>
</div>

<div class="sale-new">
    <h1>New Arrival</h1>

</div>
<div id="new-arrival" class="container">
</div>
<div class="view-more">
    <a href="new-arrival.html">
        <button>View More</button>
    </a>
</div>

<div id="footer"></div>
<script src="products.js"></script>
<script src="script.js"></script>
</body>
</html>
