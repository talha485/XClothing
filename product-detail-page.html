<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Detail - X Clothing</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div id="header"></div> <div id="detail-content">
</div>

<div id="footer"></div>

<script src="products.js"></script>

<script>
    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id');

    const product = products.find(p => p.id == productId);


    const container = document.getElementById('detail-content');

    if (product) {
        container.innerHTML = `
            <div class="detail-wrapper">
                <div class="image-box">
                    <img src="${product.img}" alt="${product.name}">
                </div>
                <div class="info-box">
                    <h1>${product.name}</h1>
                    <p class="category">Category: ${product.category}</p>

                    <div class="price">
                        ${product.oldPrice ? `<span class="old-price">Rs. ${product.oldPrice}</span>` : ''}
                        <span class="new-price">Rs. ${product.newPrice}</span>
                    </div>

                    <p>High quality ${product.name} from X Clothing's latest collection.</p>

                    <button class="btn-add-cart">
                        ADD TO CART
                    </button>
                </div>
            </div>
        `;
    } else {
        container.innerHTML = "<h2>Product Not Found</h2><a href='index.html'>Back to Home</a>";
    }
</script>
<script src="script.js"></script>
</body>
</html>
